name: Build & Release

on:
  push:
    branches: [ main ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Needed for the release step to create a GitHub Release on tag pushes.
permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest

    steps:
      # -- Checkout ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -- .NET 8 SDK ----------------------------------------------------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # -- Cache NuGet ---------------------------------------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      # -- Restore -------------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore Coffer/Coffer.csproj

      # -- Build (validate) ----------------------------------------------------
      - name: Build
        run: dotnet build Coffer/Coffer.csproj -c Release --no-restore

      # -- Publish portable single-file EXE ------------------------------------
      - name: Publish portable EXE
        run: |
          dotnet publish Coffer/Coffer.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output publish

      # -- Inno Setup installer -------------------------------------------------
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Coffer.iss /Odist
        shell: pwsh

      # -- SHA-256 checksums ---------------------------------------------------
      - name: Generate checksums
        run: |
          Get-FileHash dist\Coffer-Portable.exe, dist\Coffer-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii dist\SHA256SUMS.txt
        shell: pwsh

      # -- Upload build artifacts (every push) ---------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Coffer-${{ github.sha }}
          path: |
            dist/Coffer-Portable.exe
            dist/Coffer-Setup.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      # -- Create GitHub Release (on tag push only) -----------------------------
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Coffer ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/Coffer-Portable.exe
            dist/Coffer-Setup.exe
            dist/SHA256SUMS.txt
          body: |
            ## Coffer ${{ github.ref_name }}

            ### Downloads
            | File | Description |
            |---|---|
            | `Coffer-Setup.exe` | Windows installer (recommended) |
            | `Coffer-Portable.exe` | No install needed -- run from anywhere |
            | `SHA256SUMS.txt` | SHA-256 checksums for both executables |

            ### What's changed
            See [CHANGELOG.md](https://github.com/NurAbir/Coffer/blob/main/CHANGELOG.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
